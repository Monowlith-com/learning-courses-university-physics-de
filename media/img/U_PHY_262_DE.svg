<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Valenz- und Leitungsband mit eingezeichneter Energielücke sowie Fermi-Niveau des intrinsischen und n-dotierten Halbleiters">
<title>Halbleiter-Bänder und Fermi-Niveau</title>
<desc>Dotierung verändert das Fermi-Niveau im Bandabstand.</desc>
<rect x="0.0" y="0.0" width="960.0" height="600.0" rx="0" fill="white" stroke="white"/>
